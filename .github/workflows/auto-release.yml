name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Syntax check
        run: npm run check:syntax

      - name: Create release archive
        run: |
          zip -r release.zip . \
            -x "*.git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x ".env" \
            -x ".env.*" \
            -x "session/*" \
            -x "auth_info_baileys/*" \
            -x "creds.json" \
            -x "*.log" \
            -x "owner.json" \
            -x "release.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release.zip \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
