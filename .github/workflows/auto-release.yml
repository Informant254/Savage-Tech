name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.6.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._-][A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Create release archive
        run: |
          zip -r release.zip . \
            -x "*.git/*" \
            -x ".github/*" \
            -x "**/node_modules/*" \
            -x "**/.env" \
            -x "**/.env.*" \
            -x "**/session/*" \
            -x "**/auth_info_baileys/*" \
            -x "**/creds.json" \
            -x "**/owner.json" \
            -x "**/*.log" \
            -x "spence.key" \
            -x "release.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" release.zip --generate-notes --title "$RELEASE_TAG"
